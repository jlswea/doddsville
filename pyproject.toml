[project]
name = "doddsville"
version = "0.0.3"
description = "Security data sensors for the dv database"
requires-python = ">=3.10"

[project.scripts]
dv-sensor = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "formatting", "config"]
packages = ["commands", "sensors"]
